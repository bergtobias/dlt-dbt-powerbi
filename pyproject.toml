[project]
name = "data-pipeline"
version = "0.1.0"
description = "End-to-end data pipeline: DLT ingestion → dbt transformations → Power BI PBIR report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[mssql]>=1.0.0",
    "dbt-sqlserver>=1.9.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.37.0",
]
